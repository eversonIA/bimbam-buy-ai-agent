[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bimbam-buy-ai-agent"
version = "0.1.0"
description = "Agente RAG para a base de conhecimento da BimBam Buy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "eversonIA" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "google-genai>=1.0,<2",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "python-pptx>=1.0,<2",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.42,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

